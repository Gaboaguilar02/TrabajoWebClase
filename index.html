<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress - Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="login">

    <!-- Columna izquierda: panel azul -->
    <section class="login__brand">
      <h1 class="brand-name">AdminExpress</h1>
    </section>

    <!-- Columna derecha: formulario -->
    <section class="login__form-area">
      <form class="form">
        <h2 class="form__title">Let's <strong>Sign In</strong> 👇</h2>
        <p class="form__subtitle">Hey, Enter your details to get sign in to your account.</p>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="3" y="5" width="18" height="14" rx="2"/>
  <path d="m3 7 9 6 9-6"/>
</svg>
            <input type="email" id="email" placeholder="Enter Email">
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="5" y="11" width="14" height="10" rx="2"/>
  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
</svg>
            <input type="password" id="password" placeholder="Enter Password">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
  <line x1="1" y1="1" x2="23" y2="23"/>
</svg>
          </div>
        </div>

        <a href="#" class="forgot">Forgot password?</a>

        <button type="submit" class="btn">Sign In</button>

        <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
      </form>
    </section>

  </main>

</body>
</html>
